<!DOCTYPE html>
<html lang="pl-PL">
  <head>
    <meta charset="UTF-8" />
    <script>(function(){var t=localStorage.getItem('theme');if(t==='light'){document.documentElement.setAttribute('data-theme','light');}else if(!t||t==='system'){if(window.matchMedia('(prefers-color-scheme: light)').matches)document.documentElement.setAttribute('data-theme','light');}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ustaw nowe hasło - Filmy</title>
    <meta name="description" content="Ustaw nowe hasło do konta" />

    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />

    <link type="image/png" sizes="96x96" rel="icon" href="./icons8-film-reel-96.png" />

    <script src="./assets/js/resetPassword.js" type="module"></script>
  </head>
  <body>
    <header class="header">
      <a href="/" class="logo">
        <img src="./assets/imgs/logoDarkTheme.svg" class="logo-img logo-dark" height="32" alt="" />
        <img src="./assets/imgs/logoLightTheme.svg" class="logo-img logo-light" height="32" alt="" />
        <span class="logo-name">Filmy</span>
      </a>
    </header>
    <main class="reset-page-host">
      <div class="reset-page">
        <div class="reset-card">
          <h1 class="reset-title">Ustaw nowe hasło</h1>

          <form class="auth-form" id="reset-form" novalidate>
            <div class="auth-field">
              <label class="auth-label" for="reset-new-password">Nowe hasło</label>
              <div class="auth-password-wrapper">
                <input type="password" id="reset-new-password" class="auth-input"
                       placeholder="Min. 6 znaków" required autocomplete="new-password" minlength="6" />
              </div>
            </div>
            <div class="auth-field">
              <label class="auth-label" for="reset-confirm-password">Potwierdź nowe hasło</label>
              <div class="auth-password-wrapper">
                <input type="password" id="reset-confirm-password" class="auth-input"
                       placeholder="Powtórz hasło" required autocomplete="new-password" />
              </div>
            </div>
            <p class="auth-message" id="reset-msg" aria-live="polite"></p>
            <button type="submit" class="btn auth-submit-btn" id="reset-submit">Zapisz nowe hasło</button>
          </form>

          <div id="reset-done" hidden>
            <p class="auth-confirm-body">Hasło zostało zmienione. Zaloguj się nowym hasłem.</p>
            <a href="/" class="btn auth-submit-btn">Przejdź do logowania</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
